services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unify
      POSTGRES_PASSWORD: unify
      POSTGRES_DB: unify
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
