<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}unify{% endblock %}</title>
    <meta name="description" content="unify — a self-hosted home for your personal notes, bookmarks, and expenses.">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232459a6'/%3E%3Ctext x='32' y='45' font-family='system-ui, sans-serif' font-size='40' font-weight='700' fill='%23ffffff' text-anchor='middle'%3Eu%3C/text%3E%3C/svg%3E">
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f5f6f8; color: #20242b; }
      header, main { width: min(100% - 2rem, 720px); margin-inline: auto; }
      header { padding-block: 1.25rem; border-bottom: 1px solid #d8dce2; }
      nav { display: flex; flex-wrap: wrap; gap: .6rem 1.25rem; }
      nav form { display: inline; margin: 0 0 0 auto; }
      nav a { font-weight: 600; }
      main { padding-block: 2rem; }
      a { color: #2459a6; }
      h1 { margin-top: 0; }
      form { display: grid; gap: .75rem; margin-block: 1rem 1.5rem; }
      input, textarea, button {
        font: inherit;
        border: 1px solid #aeb6c2;
        border-radius: .4rem;
        padding: .65rem .75rem;
      }
      textarea { min-height: 7rem; resize: vertical; }
      button { width: fit-content; cursor: pointer; background: #e8edf5; }
      button:hover { background: #dbe5f3; }
      .card {
        margin-block: .75rem;
        padding: 1rem;
        border: 1px solid #d8dce2;
        border-radius: .6rem;
        background: #fff;
      }
      .card h2, .card h3 { margin: 0 0 .5rem; overflow-wrap: anywhere; }
      .card p { white-space: pre-wrap; overflow-wrap: anywhere; }
      .tags { display: flex; flex-wrap: wrap; gap: .6rem; color: #526174; }
      .error { color: #a21d2d; }
      .login-card { max-width: 320px; margin: 3rem auto; }
      .chart { display: grid; gap: .5rem; }
      .chart-row { display: grid; grid-template-columns: 8rem 1fr 5rem; align-items: center; gap: .75rem; }
      .chart-label { overflow-wrap: anywhere; }
      .chart-bar { height: .8rem; fill: #3973c6; background: #3973c6; }
      .chart-value { text-align: right; font-variant-numeric: tabular-nums; }
      .muted { color: #5b6572; }
      #toast { position: fixed; right: 1rem; bottom: 1rem; }
      @media (max-width: 420px) {
        nav { gap: .5rem .9rem; }
        .chart-row { grid-template-columns: 5.5rem 1fr 4.5rem; }
      }
      @media (prefers-color-scheme: dark) {
        body { background: #171a1f; color: #e6e9ee; }
        header, .card { border-color: #39414c; }
        .card { background: #20252d; }
        a { color: #9fc4ff; }
        input, textarea, button { color: inherit; background: #20252d; border-color: #586271; }
        button:hover { background: #303a48; }
        .tags { color: #b0bac8; }
        .error { color: #ff929d; }
        .chart-bar { fill: #8bb8ff; background: #8bb8ff; }
        .muted { color: #aab4c2; }
      }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="Main navigation">
        <a href="/ui/notes">Notes</a>
        <a href="/ui/bookmarks">Bookmarks</a>
        <a href="/ui/expenses">Expenses</a>
        {% if request.cookies.get("unify_session") %}
          <form method="post" action="/logout" style="display:inline">
            <button type="submit">Log out</button>
          </form>
        {% endif %}
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
